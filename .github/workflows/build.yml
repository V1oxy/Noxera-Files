name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            args: ""
            raw_path: src-tauri/target/release/project-manager.exe
          - platform: macos-latest
            name: macos-arm64
            args: "--target aarch64-apple-darwin"
            raw_path: src-tauri/target/aarch64-apple-darwin/release/project-manager
          - platform: macos-latest
            name: macos-intel
            args: "--target x86_64-apple-darwin"
            raw_path: src-tauri/target/x86_64-apple-darwin/release/project-manager

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Draft a GitHub Release with the installers attached when the
          # workflow runs on a version tag; otherwise just build and upload
          # artifacts for inspection.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Project Manager {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # The raw executable next to target/**/release/ needs no installer and
      # no admin rights - copy/unzip and double-click (a "portable" build).
      - name: Upload portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: project-manager-${{ matrix.name }}-portable
          path: ${{ matrix.raw_path }}
          if-no-files-found: warn

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: project-manager-${{ matrix.name }}-installer
          path: |
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn

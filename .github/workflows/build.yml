name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fast path: every push to main builds only the Windows portable exe, so a
  # fresh downloadable build is ready a few minutes after each change.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noxera Files {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # The raw .exe next to target/release/ needs no installer and no admin
      # rights - unzip and double-click (a "portable" build).
      - name: Upload portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-windows-x64-portable
          path: src-tauri/target/release/noxera-files.exe
          if-no-files-found: warn

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-windows-x64-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn

  # Full path: macOS (Apple Silicon + Intel) only builds for a version tag or
  # when explicitly requested, since it roughly triples total CI time.
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            args: "--target aarch64-apple-darwin"
            raw_path: src-tauri/target/aarch64-apple-darwin/release/noxera-files
          - name: macos-intel
            args: "--target x86_64-apple-darwin"
            raw_path: src-tauri/target/x86_64-apple-darwin/release/noxera-files

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noxera Files {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-${{ matrix.name }}-portable
          path: ${{ matrix.raw_path }}
          if-no-files-found: warn

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-${{ matrix.name }}-installer
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn

name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Fast path: every push to main builds only the Windows portable exe, so a
  # fresh downloadable build is ready a few minutes after each change.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-notes step below diffs the new
          # tag against the previous one, which a shallow clone can't see.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Turns commit subjects since the last tag into the categorized
      # "What's new" body for this release - see the script for how commits
      # are bucketed. Only meaningful for a tagged release; a no-op
      # elsewhere since releaseBody below is unused without a tagName.
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/generate-release-notes.mjs >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle + latest.json so the in-app updater can
          # verify it against the pubkey baked into tauri.conf.json. Only
          # set when a version tag is pushed - see README/docs for how to
          # generate this pair (`tauri signer generate`) and store it here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noxera Files {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body || '' }}
          releaseDraft: false
          prerelease: false

      # The raw .exe next to target/release/ needs no installer and no admin
      # rights - unzip and double-click (a "portable" build).
      - name: Upload portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-windows-x64-portable
          path: src-tauri/target/release/noxera-files.exe
          if-no-files-found: warn

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-windows-x64-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn

  # Full path: macOS (Apple Silicon + Intel) only builds for a version tag or
  # when explicitly requested, since it roughly triples total CI time.
  build-macos:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            args: "--target aarch64-apple-darwin"
            raw_path: src-tauri/target/aarch64-apple-darwin/release/noxera-files
          - name: macos-intel
            args: "--target x86_64-apple-darwin"
            raw_path: src-tauri/target/x86_64-apple-darwin/release/noxera-files

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-notes step below diffs the new
          # tag against the previous one, which a shallow clone can't see.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Turns commit subjects since the last tag into the categorized
      # "What's new" body for this release - see the script for how commits
      # are bucketed. Only meaningful for a tagged release; a no-op
      # elsewhere since releaseBody below is unused without a tagName.
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/generate-release-notes.mjs >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle + latest.json so the in-app updater can
          # verify it against the pubkey baked into tauri.conf.json. Only
          # set when a version tag is pushed - see README/docs for how to
          # generate this pair (`tauri signer generate`) and store it here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noxera Files {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body || '' }}
          releaseDraft: false
          prerelease: false

      - name: Upload portable executable
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-${{ matrix.name }}-portable
          path: ${{ matrix.raw_path }}
          if-no-files-found: warn

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: noxera-files-${{ matrix.name }}-installer
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
